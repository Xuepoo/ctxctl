[workspace]
resolver = "2"
members = ["crates/ctx-symbol", "crates/ctx-exec", "crates/ctxctl"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
authors = ["fuyu"]
repository = "https://github.com/Xuepoo/ctxctl-cli"
homepage = "https://ctxctl.xuepoo.xyz"

[workspace.dependencies]
ctx-symbol = { path = "crates/ctx-symbol", version = "0.2.0" }
ctx-exec = { path = "crates/ctx-exec", version = "0.2.0" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tree-sitter = "0.26"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
tree-sitter-python = "0.25"
tree-sitter-go = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-java = "0.23"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-c-sharp = "0.23"
tree-sitter-ruby = "0.23"
tree-sitter-lua = "0.5"
regex = "1"
shell-words = "1"
toml = "1.1"
tiktoken-rs = "0.12"

# rustflags shared across the workspace
[profile.release]
lto = "thin"
strip = "symbols"
